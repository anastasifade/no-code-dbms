spring:
  application:
    name: no-code-dbms
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/no_code_dbms_db?currentSchema=user_data,public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: metadata
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.core: DEBUG
    io.github.anastasifade: DEBUG