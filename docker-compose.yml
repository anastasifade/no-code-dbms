services:
  postgres:
    image: postgres:18
    container_name: no_code_dbms_postgres
    hostname: postgres
    environment:
      POSTGRES_DB: no_code_dbms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: